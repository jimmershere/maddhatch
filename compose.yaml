version: "3.9"
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672","15672:15672"]
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"'
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maddhatchery
    volumes:
      - ./db:/docker-entrypoint-initdb.d

  ldap:
    image: osixia/openldap:1.5.0
    hostname: ldap
    env_file: .env
    environment:
      LDAP_ORGANISATION: Madd Hatchery
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${MADDH_LDAP_BIND_PASSWORD:-3wm078uu}
      LDAP_CONFIG_PASSWORD: ${MADDH_LDAP_BIND_PASSWORD:-3wm078uu}
      LDAP_READONLY_USER: "false"
      LDAP_TLS: "true"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_CRT_FILENAME: ${LDAP_TLS_CRT_FILENAME:-fullchain.pem}
      LDAP_TLS_KEY_FILENAME: ${LDAP_TLS_KEY_FILENAME:-privkey.pem}
      LDAP_TLS_CA_CRT_FILENAME: ${LDAP_TLS_CA_CRT_FILENAME:-fullchain.pem}
    ports:
      - "${LDAP_HOST_PORT:-1389}:389"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./config/certs:/container/service/slapd/assets/certs:rw,z

  smtp:
    build: ./smtp
    hostname: smtp.maddhatchery.com
    env_file: .env
    environment:
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USER: ${SMTP_RELAY_USER:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@maddhatchery.com}
      SMTP_ACCOUNT: ${SMTP_ACCOUNT:-default}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-smtp.maddhatchery.com}
      SMTP_TLS: ${SMTP_TLS:-on}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-on}
      SMTP_TLS_CERTCHECK: ${SMTP_TLS_CERTCHECK:-on}
      SMTP_TLS_TRUST_FILE: ${SMTP_TLS_TRUST_FILE:-}
      SMTP_TLS_FINGERPRINT: ${SMTP_TLS_FINGERPRINT:-}
      SMTP_LISTEN_HOST: ${SMTP_LISTEN_HOST:-0.0.0.0}
      SMTP_LISTEN_PORT: ${SMTP_LISTEN_PORT:-1025}
    ports:
      - "${SMTP_HOST_PORT:-1025}:1025"
    volumes:
      - ./smtp/config:/etc/msmtp

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/maddhatchery?sslmode=disable}
      MADDH_SHARED_SECRET: ${MADDH_SHARED_SECRET:-maddh-shared-secret}
    depends_on:
      - db
      - ldap
    volumes:
      - ./config/certs:/certs:ro,z

  rbac:
    build: ./rbac
    env_file: .env
    environment:
      MADDH_API_URL: ${MADDH_API_URL:-http://api:8000}
      MADDH_SHARED_SECRET: ${MADDH_SHARED_SECRET:-maddh-shared-secret}
      RBAC_SESSION_SECRET: ${RBAC_SESSION_SECRET:-change-me}
      RBAC_COOKIE_DOMAIN: ${RBAC_COOKIE_DOMAIN:-}
    ports:
      - "4180:4180"
    depends_on:
      - api

  frontend:
    build: ./frontend_go
    env_file: .env
    environment:
      AMQP_URL: ${AMQP_URL:-amqp://app:app@rabbitmq:5672/}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/maddhatchery?sslmode=disable}
      RMQ_EXCHANGE: ${RMQ_EXCHANGE:-orders.direct}
      MADDH_API_URL: ${MADDH_API_URL:-http://api:8000}
      MADDH_SHARED_SECRET: ${MADDH_SHARED_SECRET:-maddh-shared-secret}
      MADDH_OAUTH2_PROXY_URL: ${MADDH_OAUTH2_PROXY_URL:-http://rbac:4180/oauth2}
      MADDH_OAUTH2_PROXY_INTERNAL_URL: ${MADDH_OAUTH2_PROXY_INTERNAL_URL:-}
      MADDH_OAUTH2_PROXY_INSECURE_SKIP_VERIFY: ${MADDH_OAUTH2_PROXY_INSECURE_SKIP_VERIFY:-false}
      MADDH_OAUTH2_START: ${MADDH_OAUTH2_START:-/oauth2/start}
      RBAC_SESSION_SECRET: ${RBAC_SESSION_SECRET:-rbac-session-secret}
    volumes:
      - ./config/certs:/certs:ro,z
    ports: ["8443:8443"]
    depends_on:
      - rabbitmq
      - db
      - api
      - rbac

  worker:
    image: python:3.12-slim
    working_dir: /app
    environment:
      AMQP_URL: amqp://app:app@rabbitmq:5672/
      DATABASE_URL: postgres://postgres:postgres@db:5432/maddhatchery?sslmode=disable
      RMQ_EXCHANGE: orders.direct
    volumes:
      - ./workers:/app
    command: ["/bin/sh","-c","pip install -r requirements.txt && python order_worker.py"]
    depends_on:
      - rabbitmq
      - db

  receipts:
    image: python:3.12-slim
    working_dir: /app
    environment:
      AMQP_URL: amqp://app:app@rabbitmq:5672/
      DATABASE_URL: postgres://postgres:postgres@db:5432/maddhatchery?sslmode=disable
      RMQ_EXCHANGE: orders.direct
      OUTPUT_DIR: /out
    volumes:
      - ./workers:/app
      - ./out:/out
    command: ["/bin/sh","-c","pip install -r requirements.txt && python receipts_worker.py"]
    depends_on: [rabbitmq, db]

  cashapp:
    image: python:3.12-slim
    working_dir: /app
    environment:
      AMQP_URL: amqp://app:app@rabbitmq:5672/
      DATABASE_URL: postgres://postgres:postgres@db:5432/maddhatchery?sslmode=disable
      RMQ_EXCHANGE: orders.direct
    volumes: [ "./workers:/app" ]
    command: ["/bin/sh","-c","pip install -r requirements.txt && python cashapp_worker.py"]
    depends_on: [rabbitmq, db]

  taxer:
    image: python:3.12-slim
    working_dir: /app
    environment:
      AMQP_URL: amqp://app:app@rabbitmq:5672/
      DATABASE_URL: postgres://postgres:postgres@db:5432/maddhatchery?sslmode=disable
      RMQ_EXCHANGE: orders.direct
    volumes: [ "./workers:/app" ]
    command: ["/bin/sh","-c","pip install -r requirements.txt && python tax_worker.py"]
    depends_on: [rabbitmq, db]

volumes:
  ldap_data:
  ldap_config:
