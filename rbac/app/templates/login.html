<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in • Madd Hatchery</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f8fafc; margin:0; }
    .wrap { max-width:420px; margin:5vh auto; background:#fff; padding:32px; border-radius:16px; box-shadow:0 12px 30px rgba(15,23,42,.12); }
    h1 { margin-top:0; color:#0f172a; font-size:1.75rem; }
    label { display:block; margin:16px 0 4px; font-weight:600; color:#1e293b; }
    input { width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5f5; font-size:1rem; }
    button { margin-top:24px; background:#ea4a8a; border:none; color:#fff; font-weight:600; font-size:1rem; padding:12px 18px; border-radius:999px; cursor:pointer; width:100%; }
    button:hover { background:#d23572; }
    .note { margin-top:16px; color:#475569; font-size:0.95rem; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Madd Hatchery Sign-in</h1>
    <form method="post" action="/oauth2/sign_in">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Continue</button>
      <p class="note">Use your Madd Hatchery administrator or portal credentials. Trouble? Reach Trish at <a href="mailto:support@maddhatchery.example">support@maddhatchery.example</a>.</p>
    </form>
  </div>
</body>
</html>
