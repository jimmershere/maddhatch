name: Publish maddhatchery.com

# Pipeline mirrors portwright.io: validate HTML on every push/PR; DEPLOY is the
# human gate — it runs only on a manual "Run workflow" from main, and re-runs
# validation first. Adapted for a Node service: we rsync the whole app, then
# install prod deps and restart the service over SSH. Credentials live only in
# repository secrets (see README.md → Deploy).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-maddhatchery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: htmlhint
        run: npx --yes htmlhint@^1 "public/**/*.html"
      - name: server.js parses
        run: node --check server.js && node --check db.js

  deploy:
    name: Deploy to maddhatchery.com
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets are configured
        id: guard
        env:
          HOST: ${{ secrets.MADDHATCHERY_HOST }}
          KEY: ${{ secrets.MADDHATCHERY_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT";
            echo "::warning::MADDHATCHERY_HOST / MADDHATCHERY_SSH_KEY not set; skipping publish."; fi

      - name: Configure SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.MADDHATCHERY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MADDHATCHERY_KNOWN_HOSTS }}
          HOST: ${{ secrets.MADDHATCHERY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts;
          else ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Publish app via rsync over SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.MADDHATCHERY_HOST }}
          DEPLOY_USER: ${{ secrets.MADDHATCHERY_USER }}
          REMOTE_PATH: ${{ secrets.MADDHATCHERY_PATH }}
        run: |
          DEPLOY_USER="${DEPLOY_USER:-deploy}"
          REMOTE_PATH="${REMOTE_PATH:-/var/www/maddhatchery}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_USER}@${HOST}" "mkdir -p '${REMOTE_PATH}'"
          rsync -avz --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'data' \
            --exclude '.env' --exclude '.claude' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_USER}@${HOST}:${REMOTE_PATH}/"
          echo "Synced app to ${HOST}:${REMOTE_PATH}"

      - name: Install deps & restart service
        if: steps.guard.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.MADDHATCHERY_HOST }}
          DEPLOY_USER: ${{ secrets.MADDHATCHERY_USER }}
          REMOTE_PATH: ${{ secrets.MADDHATCHERY_PATH }}
        run: |
          DEPLOY_USER="${DEPLOY_USER:-deploy}"
          REMOTE_PATH="${REMOTE_PATH:-/var/www/maddhatchery}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_USER}@${HOST}" \
            "cd '${REMOTE_PATH}' && bash scripts/deploy-restart.sh"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.guard.outputs.ready }}" = "true" ]; then
            echo "Deployed → https://maddhatchery.com/";
          else
            echo "Deploy skipped: configure production secrets to enable publishing.";
          fi
